name: Bug report
description: Something in Cartulary is broken or behaving wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please check the [existing issues](https://github.com/chris-3345/cartulary/issues) first in case it's already been reported.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Open a game's details
        2. Change the rating
        3. Click Save
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Cartulary version
      description: The version you downloaded (e.g. 0.1.0) or the commit hash if you built from source.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 24H2, macOS 26, Ubuntu 24.04

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows installer (.exe)
        - macOS disk image (.dmg)
        - Linux AppImage
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Error messages, screenshots, etc.
      description: |
        Paste any error dialogs or terminal output here/drag in screenshots.

        **If you attach your `library.json`, remember it contains your notes.** Remove anything private.
