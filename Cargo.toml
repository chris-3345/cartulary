[package]
name = "cartulary"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
iced = { version = "0.14", features = ["svg"] }
resvg = "0.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[build-dependencies]
winresource = "0.1.34"
